<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Rentmatic</title>
    <style>
        :root {
            --primary-color: #478778;
            --sidebar-bg: rgba(240, 255, 235, 0.9);
            --active-nav: #90EE90;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-image: url('background-messages.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .header {
            background-color: var(--primary-color);
            height: 60px;
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .logo {
            height: 55px;
            width: auto;
        }

        .dashboard-label {
            color: white;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: capitalize;
            margin-left: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .sidebar {
            width: 200px;
            height: 100vh;
            background-color: var(--sidebar-bg);
            position: fixed;
            left: 0;
            top: 60px;
            padding: 20px;
            border-right: 1px solid #eee;
        }

        .nav-item {
            width: 160px;
            padding: 10px;
            margin: 5px 0;
            display: flex;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            transition: background-color 0.2s;
            gap: 10px;
            border-radius: 5px;
        }

        .nav-item:hover, .nav-item.active {
            background-color: var(--active-nav);
            color: black;
        }

        .nav-item:hover .nav-icon, .nav-item.active .nav-icon {
            filter: brightness(0);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            filter: brightness(0);
        }

        .main-content {
            margin-left: 200px;
            margin-top: 60px;
            padding: 20px;
            display: flex;
            gap: 20px;
            height: calc(100vh - 60px);
        }

        .contact-box {
            width: 300px;
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
        }

        .contact-header {
            background-color: var(--primary-color);
            padding: 15px;
            color: white;
        }

        .contact-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .contact-item img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .contact-info {
            flex-grow: 1;
        }

        .contact-name {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .contact-unit {
            font-size: 14px;
            color: #666;
        }

        .message-box {
            flex-grow: 1;
            background-color: white;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .message-header {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .message-header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .message-area {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message-input {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .message-input input {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
        }

        .message-input button {
            padding: 12px 24px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .selected-tenant {
            background-color: #f0f5f0;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="Rentmatic-Logo.png" alt="Rentmatic" class="logo">
            <div class="dashboard-label">Messages</div>
        </div>
    </div>

    <div class="sidebar">
        <a href="dashboard.html" class="nav-item">
            <img src="dashboard-icon.png" alt="" class="nav-icon">
            <span>Home</span>
        </a>
        <a href="ai-assistant.html" class="nav-item">
            <img src="ai-icon.png" alt="" class="nav-icon">
            <span>AI Assistant</span>
        </a>
        <a href="tenants.html" class="nav-item">
            <img src="tenants-icon.png" alt="" class="nav-icon">
            <span>Tenants</span>
        </a>
        <a href="units.html" class="nav-item">
            <img src="units-icon.png" alt="" class="nav-icon">
            <span>Unit Management</span>
        </a>
        <a href="messages.html" class="nav-item active">
            <img src="messages-icon.png" alt="" class="nav-icon">
            <span>Messages</span>
        </a>
        <a href="settings.html" class="nav-item">
            <img src="settings-icon.png" alt="" class="nav-icon">
            <span>Settings</span>
        </a>
    </div>

    <div class="main-content">
        <div class="contact-box">
            <div id="contactsList">
                <!-- Contacts will be loaded here -->
            </div>
        </div>

        <div class="message-box">
            <div class="message-header" id="selectedTenantHeader">
                <!-- Selected tenant info will appear here -->
            </div>
            <div class="message-area" id="messageArea">
                <!-- Messages will appear here -->
            </div>
            <div class="message-input">
                <input type="text" id="messageInput" placeholder="Type your message...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let currentTenantId = null;
        let tenantsData = [];
        let chatHistory = {};

        // Load tenants and initialize on page load
        window.addEventListener('load', () => {
            loadTenants();
            displayTenants();

            // Listen for changes in tenants data
            window.addEventListener('storage', (e) => {
                if (e.key === 'tenants') {
                    loadTenants();
                    displayTenants();
                }
            });
        });

        function loadTenants() {
            tenantsData = JSON.parse(window.api.getItem('tenants')) || [];
            
            // Initialize chat history for new tenants
            tenantsData.forEach(tenant => {
                if (!chatHistory[tenant.id]) {
                    chatHistory[tenant.id] = [];
                }
            });

            // Load existing chat history
            const savedHistory = window.api.getItem('chatHistory');
            if (savedHistory) {
                chatHistory = JSON.parse(savedHistory);
            }
        }

        function displayTenants() {
            const contactsList = document.getElementById('contactsList');
            contactsList.innerHTML = '';

            tenantsData.forEach(tenant => {
                const contactItem = document.createElement('div');
                contactItem.className = `contact-item ${tenant.id === currentTenantId ? 'selected-tenant' : ''}`;
                contactItem.innerHTML = `
                    <img src="${tenant.profileImage || 'tenants-icon.png'}" alt="${tenant.name}">
                    <div class="contact-info">
                        <div class="contact-name">${tenant.name}</div>
                        <div class="contact-unit">Unit ${tenant.unit || 'Not Assigned'}</div>
                    </div>
                `;
                contactItem.onclick = () => selectTenant(tenant);
                contactsList.appendChild(contactItem);
            });
        }

        function selectTenant(tenant) {
            currentTenantId = tenant.id;
            displayTenants();

            // Update message header
            const header = document.getElementById('selectedTenantHeader');
            header.innerHTML = `
                <img src="${tenant.profileImage || 'tenants-icon.png'}" alt="${tenant.name}">
                <div class="contact-info">
                    <div class="contact-name">${tenant.name}</div>
                    <div class="contact-unit">Unit ${tenant.unit || 'Not Assigned'}</div>
                </div>
            `;

            // Display chat history
            displayMessages(tenant.id);
        }

        function displayMessages(tenantId) {
            const messageArea = document.getElementById('messageArea');
            messageArea.innerHTML = '';
            
            if (chatHistory[tenantId]) {
                chatHistory[tenantId].forEach(msg => {
                    const messageDiv = document.createElement('div');
                    messageDiv.className = `message ${msg.type}`;
                    messageDiv.textContent = msg.text;
                    messageArea.appendChild(messageDiv);
                });
            }
            
            messageArea.scrollTop = messageArea.scrollHeight;
        }

        function sendMessage() {
            if (!currentTenantId) return;

            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (message) {
                if (!chatHistory[currentTenantId]) {
                    chatHistory[currentTenantId] = [];
                }
                
                chatHistory[currentTenantId].push({
                    text: message,
                    type: 'sent',
                    timestamp: new Date().toISOString()
                });
                
                window.api.setItem('chatHistory', JSON.stringify(chatHistory));
                
                input.value = '';
                displayMessages(currentTenantId);
                
                // Simulate response
                setTimeout(() => simulateResponse(currentTenantId), 1000);
            }
        }

        function simulateResponse(tenantId) {
            const responses = [
                "I'll look into that right away.",
                "Thank you for letting me know.",
                "I understand, I'll get back to you soon.",
                "Got it, thanks for the update.",
                "I'll handle this as soon as possible."
            ];
            
            const response = responses[Math.floor(Math.random() * responses.length)];
            
            chatHistory[tenantId].push({
                text: response,
                type: 'received',
                timestamp: new Date().toISOString()
            });
            
            window.api.setItem('chatHistory', JSON.stringify(chatHistory));
            displayMessages(tenantId);
        }

        // Handle Enter key in message input
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
