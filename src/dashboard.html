<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rentmatic Dashboard</title>
    <style>
        :root {
            --primary-color: #2A9D8F;
            --background-color: #f5f5f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-image: url('assets/images/Dash-Background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .header {
            background-color: #478778;
            height: 60px;
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .logo {
            height: 55px;
            width: auto;
        }

        .dashboard-label {
            color: white;
            font-size: 20px;
        }

        .search-bar {
            width: 300px;
            padding: 8px;
            border: none;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.9);
        }

        .sidebar {
            width: 200px;
            height: calc(100vh - 60px);
            background-color: rgba(240, 255, 235, 0.9);
            position: fixed;
            left: 0;
            top: 60px;
            padding: 20px;
            border-right: 1px solid #eee;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .nav-sections-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: min-content;
        }

        .nav-section {
            margin-bottom: 15px;
        }

        .system-section {
            margin-top: auto;
            padding-top: 15px;
        }

        .nav-section-title {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            padding: 0 10px;
            margin-bottom: 5px;
        }

        .nav-item {
            width: 160px;
            padding: 10px;
            margin: 2px 0;
            display: flex;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            gap: 10px;
            border-radius: 5px;
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            background-color: #478778;
            color: white;
            transform: translateX(5px);
        }

        .nav-item.active {
            background-color: #478778;
            color: white;
        }

        .nav-item:hover .nav-icon {
            filter: brightness(0) invert(1);
        }

        .nav-item.active .nav-icon {
            filter: brightness(0) invert(1);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            filter: brightness(0);
        }

        .nav-divider {
            height: 1px;
            background-color: #ddd;
            margin: 10px 0;
        }

        .main-content {
            margin-left: 200px;
            margin-top: 60px;
            padding: 20px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .dashboard-card {
            background-color: rgba(237, 237, 237, 0.8);
            aspect-ratio: 1;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
        }

        .card-icon {
            width: 60px;
            height: 60px;
            margin-bottom: 10px;
        }

        .tenants-icon {
            filter: invert(48%) sepia(79%) saturate(2476%) hue-rotate(190deg) brightness(118%) contrast(119%);
        }

        .payments-icon {
            filter: invert(42%) sepia(93%) saturate(1352%) hue-rotate(87deg) brightness(119%) contrast(119%);
        }

        .units-icon {
            filter: invert(72%) sepia(32%) saturate(1217%) hue-rotate(6deg) brightness(127%) contrast(119%);
        }

        .reports-icon {
            filter: invert(60%) sepia(11%) saturate(2000%) hue-rotate(177deg) brightness(99%) contrast(96%);
        }

        .ai-icon {
            filter: invert(45%) sepia(82%) saturate(2742%) hue-rotate(264deg) brightness(101%) contrast(101%);
        }

        .card-title {
            color: #666973;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="assets/images/Rentmatic-Logo.png" alt="Rentmatic" class="logo">
            <div class="dashboard-label">Dashboard</div>
            <input type="text" class="search-bar" placeholder="Search...">
        </div>
    </div>
    <div class="sidebar">
        <div class="nav-sections-container">
            <div class="nav-section">
                <div class="nav-section-title">Main Navigation</div>
                <a href="dashboard.html" class="nav-item active">
                    <img src="assets/icons/dashboard-icon.png" alt="" class="nav-icon">
                    <span>Dashboard</span>
                </a>
                <a href="ai.html" class="nav-item">
                    <img src="assets/icons/ai-icon.png" alt="" class="nav-icon">
                    <span>AI Assistant</span>
                </a>
            </div>

            <div class="nav-divider"></div>

            <div class="nav-section">
                <div class="nav-section-title">Property Management</div>
                <a href="tenants.html" class="nav-item">
                    <img src="assets/icons/tenants-icon.png" alt="" class="nav-icon">
                    <span>Tenants</span>
                </a>
                <a href="units.html" class="nav-item">
                    <img src="assets/icons/units-icon.png" alt="" class="nav-icon">
                    <span>Units</span>
                </a>
                <a href="payments.html" class="nav-item">
                    <img src="assets/icons/payments-icon.png" alt="" class="nav-icon">
                    <span>Payments</span>
                </a>
                <a href="reports.html" class="nav-item">
                    <img src="assets/icons/reports-icon.png" alt="" class="nav-icon">
                    <span>Reports</span>
                </a>
            </div>

            <div class="nav-divider"></div>

            <div class="nav-section">
                <div class="nav-section-title">Communication</div>
                <a href="messages.html" class="nav-item">
                    <img src="assets/icons/messages-icon.png" alt="" class="nav-icon">
                    <span>Messages</span>
                </a>
            </div>
        </div>

        <div class="system-section">
            <div class="nav-section-title">System</div>
            <a href="settings.html" class="nav-item">
                <img src="assets/icons/settings-icon.png" alt="" class="nav-icon">
                <span>Settings</span>
            </a>
        </div>
    </div>

    <div class="main-content">
        <div class="dashboard-grid">
            <a href="tenants.html" class="dashboard-card">
                <img src="assets/icons/tenants-icon.png" alt="Tenants" class="card-icon tenants-icon">
                <div class="card-title">Tenants</div>
            </a>
            <a href="payments.html" class="dashboard-card">
                <img src="assets/icons/payments-icon.png" alt="Payments" class="card-icon payments-icon">
                <div class="card-title">Payments</div>
            </a>
            <a href="units.html" class="dashboard-card">
                <img src="assets/icons/units-icon.png" alt="Unit Management" class="card-icon units-icon">
                <div class="card-title">Unit Management</div>
            </a>
            <a href="reports.html" class="dashboard-card">
                <img src="assets/icons/reports-icon.png" alt="Basic Reports" class="card-icon reports-icon">
                <div class="card-title">Basic Reports</div>
            </a>
            <a href="ai.html" class="dashboard-card">
                <img src="assets/icons/ai-icon.png" alt="AI Assistant" class="card-icon ai-icon">
                <div class="card-title">AI Assistant</div>
            </a>
        </div>
    </div>
</body>
</html>
