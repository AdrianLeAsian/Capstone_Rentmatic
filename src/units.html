<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rentmatic Dashboard</title>
    <style>
        :root {
            --primary-color: #2A9D8F;
            --background-color: #f5f5f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-image: url('assets/images/Dash-Background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .header {
            background-color: #478778;
            height: 60px;
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .logo {
            height: 55px;
            width: auto;
        }

        .dashboard-label {
            color: white;
            font-size: 20px;
        }

        .search-bar {
            width: 300px;
            padding: 8px;
            border: none;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.9);
        }

        .sidebar {
            width: 200px;
            height: calc(100vh - 60px);
            background-color: rgba(240, 255, 235, 0.9);
            position: fixed;
            left: 0;
            top: 60px;
            padding: 20px;
            border-right: 1px solid #eee;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .nav-sections-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: min-content;
        }

        .nav-section {
            margin-bottom: 15px;
        }

        .nav-section-title {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            padding: 0 10px;
            margin-bottom: 5px;
        }

        .nav-item {
            width: 160px;
            padding: 10px;
            margin: 2px 0;
            display: flex;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            gap: 10px;
            border-radius: 5px;
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            background-color: #478778;
            color: white;
            transform: translateX(5px);
        }

        .nav-item.active {
            background-color: #478778;
            color: white;
        }

        .nav-item:hover .nav-icon {
            filter: brightness(0) invert(1);
        }

        .nav-item.active .nav-icon {
            filter: brightness(0) invert(1);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            filter: brightness(0);
        }

        .nav-divider {
            height: 1px;
            background-color: #ddd;
            margin: 10px 0;
        }

        .main-content {
            margin-left: 200px;
            height: calc(100vh - 60px);
            padding: 30px;
            background-color: #f8f9fa;
            overflow-y: auto;
            position: fixed;
            top: 60px;
            right: 0;
            bottom: 0;
            left: 0;
        }

        /* Header Section */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header-title {
            color: #2c3e50;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .action-button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .primary-button {
            background: #478778;
            color: white;
        }

        .primary-button:hover {
            background: #3a6e62;
        }

        .secondary-button {
            background: #e9ecef;
            color: #2c3e50;
        }

        .secondary-button:hover {
            background: #dee2e6;
        }

        .action-button img {
            width: 18px;
            height: 18px;
        }

        .primary-button img {
            filter: brightness(0) invert(1);
        }

        /* Units Grid */
        .units-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .unit-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .unit-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .unit-number {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c3e50;
        }

        .unit-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-occupied {
            background: #fee2e2;
            color: #dc2626;
        }

        .status-vacant {
            background: #dcfce7;
            color: #16a34a;
        }

        .unit-details {
            padding: 20px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .detail-label {
            color: #666;
        }

        .detail-value {
            color: #2c3e50;
            font-weight: 500;
        }

        .unit-actions {
            padding: 15px 20px;
            background: #f8f9fa;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            border-top: 1px solid #eee;
        }

        .unit-action-btn {
            padding: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .unit-action-btn:hover {
            background: #eee;
        }

        .unit-action-btn img {
            width: 20px;
            height: 20px;
            filter: brightness(0) saturate(100%) invert(45%) sepia(12%) saturate(1090%) hue-rotate(118deg) brightness(92%) contrast(86%);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .empty-state img {
            width: 60px;
            height: 60px;
            margin-bottom: 20px;
            filter: brightness(0) saturate(100%) invert(45%) sepia(12%) saturate(1090%) hue-rotate(118deg) brightness(92%) contrast(86%);
        }

        .empty-state h3 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #666;
            margin-bottom: 20px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            position: relative;
            background-color: #fff;
            margin: 30px auto;
            padding: 25px;
            width: 90%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #2c3e50;
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #2c3e50;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 30px;
        }

        /* Updated Button Styles to Match App Theme */
        .btn-primary {
            background: #478778;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .btn-primary:hover {
            background: #3a6e62;
        }

        .btn-secondary {
            background: #e9ecef;
            color: #2c3e50;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .rates-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            background-color: white;
        }

        .form-group select:focus {
            border-color: #478778;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="assets/images/Rentmatic-Logo.png" alt="Rentmatic" class="logo">
            <div class="dashboard-label">Units</div>

    </div>
    <div class="sidebar">
        <div class="nav-sections-container">
            <div class="nav-section">
                <div class="nav-section-title">Main Navigation</div>
                <a href="dashboard.html" class="nav-item">
                    <img src="assets/icons/dashboard-icon.png" alt="" class="nav-icon">

            <div class="nav-section">

                    <img src="assets/icons/payments-icon.png" alt="" class="nav-icon">

            <div class="nav-section">

        <div class="system-section">

    <div class="main-content">
        <!-- Header Section -->
        <div class="page-header">
            <h1 class="header-title">Units Management</h1>
            <div class="header-actions">
                <button class="action-button secondary-button" onclick="exportToExcel()">
                    <img src="assets/icons/export-icon.png" alt="export">
                    Export List
                </button>
                <button class="action-button primary-button" onclick="showAddUnitModal()">
                    <img src="assets/icons/add-icon.png" alt="add">
                    Add New Unit
                </button>
            </div>
        </div>

        <!-- Units Grid -->
        <div class="units-grid" id="unitsGrid">
            <!-- Units will be dynamically populated here -->
        </div>

        <!-- Empty State (shown when no units exist) -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <img src="assets/icons/units-icon.png" alt="units">
            <h3>No Units Added</h3>
            <p>Start by adding your first unit</p>
        </div>
    </div>

    <!-- Add Unit Modal -->
    <div class="modal" id="addUnitModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Unit</h2>
                <button class="close-btn" onclick="closeAddUnitModal()">&times;</button>
            </div>
            <form id="addUnitForm">
                <div class="form-group">
                    <label for="unitNumber">Unit Number</label>
                    <input type="text" id="unitNumber" required>
                </div>
                <div class="form-group">
                    <label for="type">Unit Details</label>
                    <input type="text" id="type" placeholder="e.g., Studio Type, Furnished" required>
                </div>
                <div class="rates-section">
                    <div class="form-group">
                        <label for="rateType">Rate Type</label>
                        <select id="rateType" required>
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                            <option value="monthly">Monthly</option>
                            <option value="yearly">Yearly</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="rate">Rate Amount (₱)</label>
                        <input type="number" id="rate" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="tenantId">Assign Tenant</label>
                    <select id="tenantId">
                        <option value="">Vacant</option>
                        <!-- Tenants will be loaded here -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="description">Description (Optional)</label>
                    <textarea id="description" rows="4" placeholder="Enter unit description..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeAddUnitModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Add Unit</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Update Unit Modal -->
    <div id="updateUnitModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Update Unit</h2>
            <form id="updateUnitForm" onsubmit="handleUpdateUnit(event)">
                <div class="form-group">
                    <label for="updateUnitNumber">Select Unit:</label>
                    <select id="updateUnitNumber" required onchange="populateUnitData()">
                        <option value="">Select a unit</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="updateBedrooms">Number of Bedrooms:</label>
                    <input type="number" id="updateBedrooms" min="1" required>
                </div>
                <div class="form-group">
                    <label for="updateBathrooms">Number of Bathrooms:</label>
                    <input type="number" id="updateBathrooms" min="1" required>
                </div>
                <div class="form-group">
                    <label for="updatePaymentPeriod">Payment Period:</label>
                    <select id="updatePaymentPeriod" onchange="updatePrice('update')" required>
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly" selected>Monthly</option>
                        <option value="yearly">Yearly</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="updatePrice">Price (PHP):</label>
                    <input type="number" id="updatePrice" min="0" required>
                </div>
                <div class="form-group">
                    <label for="updateTenant">Assign Tenant:</label>
                    <select id="updateTenant">
                        <option value="">Room Available</option>
                    </select>
                </div>
                <button type="submit" class="submit-button">Update Unit</button>
            </form>
        </div>
    </div>

    <!-- Remove Unit Modal -->
    <div id="removeUnitModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Remove Unit</h2>
            <form id="removeUnitForm" onsubmit="handleRemoveUnit(event)">
                <div class="form-group">
                    <label for="removeUnitNumber">Select Unit to Remove:</label>
                    <select id="removeUnitNumber" required>
                        <option value="">Select a unit</option>
                    </select>
                </div>
                <button type="submit" class="submit-button" style="background-color: #dc3545;">Remove Unit</button>
            </form>
        </div>
    </div>

    <!-- Add Item Modal -->
    <div id="addItemModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Add Item</h2>
            <form id="addItemForm" onsubmit="handleAddItem(event)">
                <div class="form-group">
                    <label for="itemName">Item Name:</label>
                    <input type="text" id="itemName" required>
                </div>
                <div class="form-group">
                    <label for="itemQuantity">Quantity:</label>
                    <input type="number" id="itemQuantity" min="1" required>
                </div>
                <button type="submit" class="submit-button">Add Item</button>
            </form>
        </div>
    </div>

    <!-- Update Item Modal -->
    <div id="updateItemModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Update Item</h2>
            <form id="updateItemForm" onsubmit="handleUpdateItem(event)">
                <div class="form-group">
                    <label for="updateItemSelect">Select Item:</label>
                    <select id="updateItemSelect" required onchange="populateItemData()">
                        <option value="">Select an item</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="updateItemQuantity">Quantity:</label>
                    <input type="number" id="updateItemQuantity" min="1" required>
                </div>
                <button type="submit" class="submit-button">Update Item</button>
            </form>
        </div>
    </div>

    <!-- Remove Item Modal -->
    <div id="removeItemModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Remove Item</h2>
            <form id="removeItemForm" onsubmit="handleRemoveItem(event)">
                <div class="form-group">
                    <label for="removeItemSelect">Select Item to Remove:</label>
                    <select id="removeItemSelect" required>
                        <option value="">Select an item</option>
                    </select>
                </div>
                <button type="submit" class="submit-button" style="background-color: #dc3545;">Remove Item</button>
            </form>
        </div>
    </div>

    <script>
        // Store tenants data globally
        let tenantsData = [];
        let unitsData = [];
        let itemsData = [];

        // Load data from localStorage on page load
        window.addEventListener('load', () => {
            tenantsData = JSON.parse(localStorage.getItem('tenants')) || [];
            unitsData = JSON.parse(localStorage.getItem('units')) || [];
            itemsData = JSON.parse(localStorage.getItem('items')) || [];
            displayUnits();
            displayItems();
        });

        function updatePrice(mode) {
            const periodSelect = mode === 'add' ? 
                document.getElementById('paymentPeriod') : 
                document.getElementById('updatePaymentPeriod');
            const priceInput = mode === 'add' ? 
                document.getElementById('price') : 
                document.getElementById('updatePrice');
            
            const currentPrice = parseFloat(priceInput.value) || 0;
            const period = periodSelect.value;
            
            // Convert current price to daily rate first
            let dailyRate;
            if(period === 'yearly') {
                dailyRate = currentPrice / 365;
            } else if(period === 'monthly') {
                dailyRate = currentPrice / 30;
            } else if(period === 'weekly') {
                dailyRate = currentPrice / 7;
            } else {
                dailyRate = currentPrice;
            }
            
            // Convert daily rate to selected period
            let newPrice;
            if(periodSelect.value === 'yearly') {
                newPrice = dailyRate * 365;
            } else if(periodSelect.value === 'monthly') {
                newPrice = dailyRate * 30;
            } else if(periodSelect.value === 'weekly') {
                newPrice = dailyRate * 7;
            } else {
                newPrice = dailyRate;
            }
            
            priceInput.value = Math.round(newPrice);
        }

        // Function to fetch and update tenants data
        async function fetchTenantsData() {
            tenantsData = JSON.parse(localStorage.getItem('tenants')) || [];
        }

        // Function to update tenant select options
        function updateTenantSelect() {
            const tenantSelect = document.getElementById('tenant');
            tenantSelect.innerHTML = '<option value="">Room Available</option>';
            
            tenantsData.forEach(tenant => {
                if (!tenant.assigned) {
                    const option = document.createElement('option');
                    option.value = tenant.name;
                    option.textContent = tenant.name;
                    tenantSelect.appendChild(option);
                }
            });
        }

        function showAddUnitModal() {
            loadTenantSelector(); // Load tenants when opening the add modal
            document.getElementById('addUnitModal').style.display = 'block';
        }

        function closeAddUnitModal() {
            const modal = document.getElementById('addUnitModal');
            if (modal) {
                modal.style.display = 'none';
            }
            // Clear the form
            document.getElementById('addUnitForm').reset();
        }

        async function handleAddUnit(event) {
            event.preventDefault();
            
            try {
                const tenantId = document.getElementById('tenantId').value;
                const newUnit = {
                    id: Date.now().toString(),
                    number: document.getElementById('unitNumber').value,
                    type: document.getElementById('type').value,
                    rateType: document.getElementById('rateType').value,
                    rate: parseFloat(document.getElementById('rate').value),
                    description: document.getElementById('description').value || 'No description provided',
                    tenantId: tenantId,
                    occupied: !!tenantId,
                    dateAdded: new Date().toISOString()
                };

                console.log('Saving new unit:', newUnit);

                const existingUnits = await window.dataAPI.getData('units') || [];
                console.log('Existing units:', existingUnits);

                const updatedUnits = [...existingUnits, newUnit];
                await window.dataAPI.saveData('units', updatedUnits);

                closeAddUnitModal();
                await initializeUnits();
                alert('Unit added successfully!');
            } catch (error) {
                console.error('Error adding unit:', error);
                alert('Failed to add unit. Please try again.');
            }
        }

        function showRemoveUnitModal() {
            const modal = document.getElementById('removeUnitModal');
            modal.style.display = 'block';
            
            const unitSelect = document.getElementById('removeUnitNumber');
            unitSelect.innerHTML = '<option value="">Select a unit</option>';
            
            unitsData.forEach(unit => {
                const option = document.createElement('option');
                option.value = unit.unitNumber;
                option.textContent = `Unit ${unit.unitNumber}`;
                unitSelect.appendChild(option);
            });
        }

        function populateUnitData() {
            const selectedUnitNumber = document.getElementById('updateUnitNumber').value;
            const selectedUnit = unitsData.find(unit => unit.unitNumber === selectedUnitNumber);
            
            if (selectedUnit) {
                document.getElementById('updateBedrooms').value = selectedUnit.bedrooms;
                document.getElementById('updateBathrooms').value = selectedUnit.bathrooms;
                document.getElementById('updatePaymentPeriod').value = selectedUnit.paymentPeriod;
                document.getElementById('updatePrice').value = selectedUnit.price;
                
                const updateTenantSelect = document.getElementById('updateTenant');
                updateTenantSelect.innerHTML = '<option value="">Room Available</option>';
                
                // Add current tenant as first option if exists
                if (selectedUnit.tenant) {
                    const currentTenantOption = document.createElement('option');
                    currentTenantOption.value = selectedUnit.tenant;
                    currentTenantOption.textContent = selectedUnit.tenant;
                    currentTenantOption.selected = true;
                    updateTenantSelect.appendChild(currentTenantOption);
                }
                
                // Add other available tenants
                tenantsData.forEach(tenant => {
                    if (!tenant.assigned || tenant.name === selectedUnit.tenant) {
                        const option = document.createElement('option');
                        option.value = tenant.name;
                        option.textContent = tenant.name;
                        updateTenantSelect.appendChild(option);
                    }
                });
            }
        }

        function showUpdateUnitModal() {
            const modal = document.getElementById('updateUnitModal');
            modal.style.display = 'block';
            
            const unitSelect = document.getElementById('updateUnitNumber');
            unitSelect.innerHTML = '<option value="">Select a unit</option>';
            
            unitsData.forEach(unit => {
                const option = document.createElement('option');
                option.value = unit.unitNumber;
                option.textContent = `Unit ${unit.unitNumber}`;
                unitSelect.appendChild(option);
            });
            
            fetchTenantsData();
        }

        function showAddItemModal() {
            const modal = document.getElementById('addItemModal');
            modal.style.display = 'block';
        }

        function showUpdateItemModal() {
            const modal = document.getElementById('updateItemModal');
            modal.style.display = 'block';
            
            const itemSelect = document.getElementById('updateItemSelect');
            itemSelect.innerHTML = '<option value="">Select an item</option>';
            
            itemsData.forEach(item => {
                const option = document.createElement('option');
                option.value = item.name;
                option.textContent = item.name;
                itemSelect.appendChild(option);
            });
        }

        function showRemoveItemModal() {
            const modal = document.getElementById('removeItemModal');
            modal.style.display = 'block';
            
            const itemSelect = document.getElementById('removeItemSelect');
            itemSelect.innerHTML = '<option value="">Select an item</option>';
            
            itemsData.forEach(item => {
                const option = document.createElement('option');
                option.value = item.name;
                option.textContent = item.name;
                itemSelect.appendChild(option);
            });
        }

        function populateItemData() {
            const selectedItemName = document.getElementById('updateItemSelect').value;
            const selectedItem = itemsData.find(item => item.name === selectedItemName);
            
            if (selectedItem) {
                document.getElementById('updateItemQuantity').value = selectedItem.quantity;
            }
        }

        function closeModal() {
            document.getElementById('addUnitModal').style.display = 'none';
            document.getElementById('updateUnitModal').style.display = 'none';
            document.getElementById('removeUnitModal').style.display = 'none';
            document.getElementById('addItemModal').style.display = 'none';
            document.getElementById('updateItemModal').style.display = 'none';
            document.getElementById('removeItemModal').style.display = 'none';
        }

        function displayUnits() {
            const unitsTableBody = document.getElementById('unitsTableBody');
            unitsTableBody.innerHTML = '';
            
            unitsData.forEach(unit => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${unit.unitNumber}</td>
                    <td class="${unit.tenant ? 'status-unavailable' : 'status-available'}">
                        ${unit.tenant ? 'Unavailable' : 'Available'}
                    </td>
                    <td>${unit.bedrooms}</td>
                    <td>${unit.bathrooms}</td>
                    <td>${unit.paymentPeriod ? unit.paymentPeriod.charAt(0).toUpperCase() + unit.paymentPeriod.slice(1) : 'Monthly'}</td>
                    <td>₱${Number(unit.price).toLocaleString()}</td>
                    <td>${unit.tenant || 'None'}</td>
                `;
                unitsTableBody.appendChild(row);
            });
        }

        function displayItems() {
            const itemsTableBody = document.getElementById('itemsTableBody');
            itemsTableBody.innerHTML = '';
            
            itemsData.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.name}</td>
                    <td>${item.quantity}</td>
                `;
                itemsTableBody.appendChild(row);
            });
        }

        function handleUpdateUnit(event) {
            event.preventDefault();
            
            const unitNumber = document.getElementById('updateUnitNumber').value;
            const bedrooms = document.getElementById('updateBedrooms').value;
            const bathrooms = document.getElementById('updateBathrooms').value;
            const paymentPeriod = document.getElementById('updatePaymentPeriod').value;
            const price = document.getElementById('updatePrice').value;
            const tenant = document.getElementById('updateTenant').value;
            
            const unitIndex = unitsData.findIndex(u => u.unitNumber === unitNumber);
            if (unitIndex !== -1) {
                const oldTenant = unitsData[unitIndex].tenant;
                if (oldTenant) {
                    const oldTenantIndex = tenantsData.findIndex(t => t.name === oldTenant);
                    if (oldTenantIndex !== -1) {
                        tenantsData[oldTenantIndex].assigned = false;
                        tenantsData[oldTenantIndex].unit = null;
                    }
                }
                
                unitsData[unitIndex] = {
                    unitNumber,
                    bedrooms,
                    bathrooms,
                    paymentPeriod: paymentPeriod.charAt(0).toUpperCase() + paymentPeriod.slice(1),
                    price,
                    tenant,
                    number: unitNumber
                };
                
                if (tenant) {
                    const newTenantIndex = tenantsData.findIndex(t => t.name === tenant);
                    if (newTenantIndex !== -1) {
                        tenantsData[newTenantIndex].assigned = true;
                        tenantsData[newTenantIndex].unit = unitNumber;
                    }
                }
                
                localStorage.setItem('units', JSON.stringify(unitsData));
                localStorage.setItem('tenants', JSON.stringify(tenantsData));
                
                displayUnits();
            }
            
            closeModal();
            event.target.reset();
        }

        function handleRemoveUnit(event) {
            event.preventDefault();
            
            const unitNumber = document.getElementById('removeUnitNumber').value;
            const unitIndex = unitsData.findIndex(u => u.unitNumber === unitNumber);
            
            if (unitIndex !== -1) {
                const unit = unitsData[unitIndex];
                if (unit.tenant) {
                    const tenantIndex = tenantsData.findIndex(t => t.name === unit.tenant);
                    if (tenantIndex !== -1) {
                        tenantsData[tenantIndex].assigned = false;
                        localStorage.setItem('tenants', JSON.stringify(tenantsData));
                    }
                }
                
                unitsData.splice(unitIndex, 1);
                localStorage.setItem('units', JSON.stringify(unitsData));
                displayUnits();
            }
            
            closeModal();
            event.target.reset();
        }

        function handleAddItem(event) {
            event.preventDefault();
            
            const name = document.getElementById('itemName').value;
            const quantity = document.getElementById('itemQuantity').value;
            
            const newItem = {
                name,
                quantity
            };
            
            itemsData.push(newItem);
            localStorage.setItem('items', JSON.stringify(itemsData));
            
            displayItems();
            closeModal();
            event.target.reset();
        }

        function handleUpdateItem(event) {
            event.preventDefault();
            
            const name = document.getElementById('updateItemSelect').value;
            const quantity = document.getElementById('updateItemQuantity').value;
            
            const itemIndex = itemsData.findIndex(item => item.name === name);
            if (itemIndex !== -1) {
                itemsData[itemIndex] = {
                    name,
                    quantity
                };
                
                localStorage.setItem('items', JSON.stringify(itemsData));
                displayItems();
            }
            
            closeModal();
            event.target.reset();
        }

        function handleRemoveItem(event) {
            event.preventDefault();
            
            const name = document.getElementById('removeItemSelect').value;
            const itemIndex = itemsData.findIndex(item => item.name === name);
            
            if (itemIndex !== -1) {
                itemsData.splice(itemIndex, 1);
                localStorage.setItem('items', JSON.stringify(itemsData));
                displayItems();
            }
            
            closeModal();
            event.target.reset();
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                closeModal();
            }
        }

        // Listen for messages from tenants.html
        window.addEventListener('message', function(event) {
            if (event.data.type === 'unitAssigned') {
                updateUnitStatus(event.data.unitNumber);
            }
        });

        // Initial fetch of tenants data
        fetchTenantsData();

        async function initializeUnits() {
            try {
                const units = await window.dataAPI.getData('units') || [];
                const tenants = await window.dataAPI.getData('tenants') || [];
                const unitsGrid = document.getElementById('unitsGrid');
                const emptyState = document.getElementById('emptyState');

                if (units.length === 0) {
                    unitsGrid.style.display = 'none';
                    emptyState.style.display = 'block';
                    return;
                }

                unitsGrid.style.display = 'grid';
                emptyState.style.display = 'none';
                unitsGrid.innerHTML = '';

                units.forEach(unit => {
                    const tenant = tenants.find(t => t.id === unit.tenantId);
                    const card = document.createElement('div');
                    card.className = 'unit-card';
                    card.innerHTML = `
                        <div class="unit-header">
                            <div class="unit-number">Unit ${unit.number}</div>
                            <span class="unit-status ${unit.occupied ? 'status-occupied' : 'status-vacant'}">
                                ${unit.occupied ? 'Occupied' : 'Vacant'}
                            </span>
                        </div>
                        <div class="unit-details">
                            <div class="detail-row">
                                <span class="detail-label">Type</span>
                                <span class="detail-value">${unit.type}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Rate (${unit.rateType})</span>
                                <span class="detail-value">₱${unit.rate.toLocaleString()}</span>
                            </div>
                            ${tenant ? `
                            <div class="detail-row">
                                <span class="detail-label">Tenant</span>
                                <span class="detail-value">${tenant.firstName} ${tenant.lastName}</span>
                            </div>
                            ` : ''}
                            <div class="detail-row">
                                <span class="detail-label">Description</span>
                                <span class="detail-value">${unit.description}</span>
                            </div>
                        </div>
                        <div class="unit-actions">
                            <button class="unit-action-btn" onclick="showEditUnitModal('${unit.id}')">
                                <img src="assets/icons/update-icon.png" alt="Edit">
                            </button>
                            <button class="unit-action-btn" onclick="confirmDeleteUnit('${unit.id}')">
                                <img src="assets/icons/remove-icon.png" alt="Delete">
                            </button>
                        </div>
                    `;
                    unitsGrid.appendChild(card);
                });
            } catch (error) {
                console.error('Error initializing units:', error);
            }
        }

        // Make sure to call initializeUnits when the page loads
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('Page loaded, verifying data storage...');
            await verifyDataStorage();
            await initializeUnits();
            
            const form = document.getElementById('addUnitForm');
            if (form) {
                form.addEventListener('submit', handleAddUnit);
            }
        });

        // Add this function to show edit modal
        async function showEditUnitModal(unitId) {
            try {
                const units = await window.dataAPI.getData('units') || [];
                const unit = units.find(u => u.id === unitId);

                // Load tenants first
                await loadTenantSelector();

                // Get the modal and update its content
                document.getElementById('unitNumber').value = unit.number;
                document.getElementById('type').value = unit.type;
                document.getElementById('rateType').value = unit.rateType;
                document.getElementById('rate').value = unit.rate;
                document.getElementById('description').value = unit.description || '';
                document.getElementById('tenantId').value = unit.tenantId || '';

                // Change modal title
                const modalTitle = document.querySelector('.modal-header h2');
                modalTitle.textContent = 'Edit Unit';

                // Change submit button
                const submitBtn = document.querySelector('.btn-primary');
                submitBtn.textContent = 'Save Changes';

                // Show the modal
                document.getElementById('addUnitModal').style.display = 'block';

                // Update form submission
                const form = document.getElementById('addUnitForm');
                form.onsubmit = async (e) => {
                    e.preventDefault();
                    
                    const tenantId = document.getElementById('tenantId').value;
                    
                    // Get updated values
                    const updatedUnit = {
                        ...unit,
                        number: document.getElementById('unitNumber').value,
                        type: document.getElementById('type').value,
                        rateType: document.getElementById('rateType').value,
                        rate: parseFloat(document.getElementById('rate').value),
                        description: document.getElementById('description').value || 'No description provided',
                        tenantId: tenantId,
                        occupied: !!tenantId
                    };

                    // Save updates
                    const updatedUnits = units.map(u => 
                        u.id === unitId ? updatedUnit : u
                    );
                    await window.dataAPI.saveData('units', updatedUnits);

                    // Close modal and refresh list
                    document.getElementById('addUnitModal').style.display = 'none';
                    await initializeUnits();
                };

            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load unit details. Please try again.');
            }
        }

        async function confirmDeleteUnit(unitId) {
            if (confirm('Are you sure you want to delete this unit?')) {
                try {
                    const units = await window.dataAPI.getData('units') || [];
                    const updatedUnits = units.filter(unit => unit.id !== unitId);
                    await window.dataAPI.saveData('units', updatedUnits);
                    await initializeUnits();
                } catch (error) {
                    console.error('Error deleting unit:', error);
                    alert('Failed to delete unit. Please try again.');
                }
            }
        }

        // Add this function to verify data storage is working
        async function verifyDataStorage() {
            try {
                const units = await window.dataAPI.getData('units');
                console.log('Current units in storage:', units);
                return true;
            } catch (error) {
                console.error('Data storage verification failed:', error);
                return false;
            }
        }

        // Add this function to load tenants into the selector
        async function loadTenantSelector() {
            try {
                const tenants = await window.dataAPI.getData('tenants') || [];
                const tenantSelect = document.getElementById('tenantId');
                tenantSelect.innerHTML = '<option value="">Vacant</option>'; // Default vacant option
                
                tenants.forEach(tenant => {
                    const option = document.createElement('option');
                    option.value = tenant.id;
                    option.textContent = `${tenant.firstName} ${tenant.lastName}`; // Display tenant's full name
                    tenantSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading tenants:', error);
            }
        }
    </script>
</body>
</html>
