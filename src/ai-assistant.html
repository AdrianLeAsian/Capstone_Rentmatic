<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rentmatic Dashboard</title>
    <style>
        :root {
            --primary-color: #2A9D8F;
            --background-color: #f5f5f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-image: url('Dash-Background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .header {
            background-color: #478778;
            height: 60px;
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .logo {
            height: 55px;
            width: auto;
        }

        .dashboard-label {
            color: white;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: capitalize;
            margin-left: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .sidebar {
            width: 200px;
            height: 100vh;
            background-color: rgba(240, 255, 235, 0.9);
            position: fixed;
            left: 0;
            top: 60px;
            padding: 20px;
            border-right: 1px solid #eee;
        }

        .nav-item {
            width: 160px;
            padding: 10px;
            margin: 5px 0;
            display: flex;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            transition: background-color 0.2s;
            gap: 10px;
            border-radius: 5px;
        }

        .nav-item:hover, .nav-item.active {
            background-color: #90EE90;
            color: black;
        }

        .nav-item:hover .nav-icon, .nav-item.active .nav-icon {
            filter: brightness(0);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            filter: brightness(0);
        }

        .main-content {
            margin-left: 200px;
            margin-top: 60px;
            padding: 20px;
            height: calc(100vh - 60px);
            display: flex;
            flex-direction: column;
        }

        /* Chat specific styles */
        .chat-container {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            margin: 5px 0;
        }

        .user-message {
            background-color: #90EE90;
            color: black;
            align-self: flex-end;
        }

        .ai-message {
            background-color: #f0f0f0;
            color: black;
            align-self: flex-start;
        }

        .chat-input-container {
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        .chat-input:focus {
            border-color: #478778;
        }

        .send-button {
            padding: 12px 24px;
            background-color: #478778;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .send-button:hover {
            background-color: #2A9D8F;
        }

        .typing-indicator {
            display: none;
            padding: 10px 15px;
            background: #e9ecef;
            border-radius: 8px;
            margin-bottom: 15px;
            color: #6c757d;
            align-self: flex-start;
        }

        .error-message {
            display: none;
            padding: 10px 15px;
            background: #dc3545;
            color: white;
            border-radius: 8px;
            margin-bottom: 15px;
            align-self: flex-start;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="Rentmatic-Logo.png" alt="Rentmatic" class="logo">
            <div class="dashboard-label">AI Assistant</div>
        </div>
    </div>

    <div class="sidebar">
        <a href="dashboard.html" class="nav-item">
            <img src="dashboard-icon.png" alt="" class="nav-icon">
            <span>Home</span>
        </a>
        <a href="ai-assistant.html" class="nav-item active">
            <img src="ai-icon.png" alt="" class="nav-icon">
            <span>AI Assistant</span>
        </a>
        <a href="tenants.html" class="nav-item">
            <img src="tenants-icon.png" alt="" class="nav-icon">
            <span>Tenants</span>
        </a>
        <a href="units.html" class="nav-item">
            <img src="units-icon.png" alt="" class="nav-icon">
            <span>Unit Management</span>
        </a>
        <a href="messages.html" class="nav-item">
            <img src="messages-icon.png" alt="" class="nav-icon">
            <span>Messages</span>
        </a>
        <a href="settings.html" class="nav-item">
            <img src="settings-icon.png" alt="" class="nav-icon">
            <span>Settings</span>
        </a>
    </div>

    <div class="main-content">
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message ai-message">
                    Hi! I'm your Rentmatic AI Assistant. I'm here to help you with managing your properties, tenants, payments, and more. Feel free to ask me anything about Rentmatic's features and how to use them.
                </div>
            </div>
            <div class="typing-indicator" id="typingIndicator">AI is typing...</div>
            <div class="error-message" id="errorMessage"></div>
            <div class="chat-input-container">
                <input type="text" class="chat-input" id="userInput" placeholder="Type your message...">
                <button class="send-button" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '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';
        const API_ENDPOINT = 'https://openrouter.ai/api/v1/chat/completions';
        let isProcessing = false;

        // Comprehensive Rentmatic context
        const rentmaticContext = {
            coreFeatures: [
                'tenant management',
                'unit management',
                'building management',
                'payment processing',
                'income tracking',
                'report generation',
                'calendar management',
                'document management',
                'maintenance tracking',
                'lease management'
            ],
            specificActions: [
                'add tenant',
                'update tenant',
                'delete tenant',
                'add unit',
                'update unit',
                'delete unit',
                'add building',
                'update building',
                'delete building',
                'process payment',
                'generate report',
                'view calendar',
                'schedule maintenance',
                'manage lease',
                'track income',
                'view analytics'
            ],
            systemTerms: [
                'rentmatic',
                'tenant',
                'unit',
                'building',
                'payment',
                'lease',
                'maintenance',
                'report',
                'calendar',
                'income',
                'analytics',
                'dashboard'
            ]
        };

        // System context for the AI
        const systemContext = `You are a friendly AI assistant for Rentmatic, a property management system. 
        Your responses should be conversational, clear, and concise. Never use XML tags or technical formatting.
        
        When explaining features or procedures:
        1. Use simple, natural language
        2. Give clear, step-by-step instructions in sentence form
        3. Keep responses focused on Rentmatic features
        4. Be friendly and helpful
        
        You help users with Rentmatic features including:
        - Tenant Management
        - Unit Management
        - Building Management
        - Payment Processing
        - Report Generation
        - Calendar Management
        - Document Management
        - Maintenance Tracking
        - Lease Management
        
        Keep your responses natural and easy to read. Never use technical tags or markers.
        If a question is not related to Rentmatic, respond with:
        "I can only help with questions about Rentmatic features and functionality. Please ask about specific Rentmatic features like unit management, tenant tracking, or payment processing."`;

        function showTypingIndicator() {
            document.getElementById('typingIndicator').style.display = 'block';
        }

        function hideTypingIndicator() {
            document.getElementById('typingIndicator').style.display = 'none';
        }

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            setTimeout(() => {
                errorElement.style.display = 'none';
            }, 5000);
        }

        function addMessage(message, type) {
            const chatMessages = document.getElementById('chatMessages');
            const messageElement = document.createElement('div');
            messageElement.className = `message ${type}`;
            messageElement.textContent = message;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function isRentmaticRelated(message) {
            const lowerMessage = message.toLowerCase();
            return rentmaticContext.coreFeatures.some(feature => lowerMessage.includes(feature)) ||
                   rentmaticContext.specificActions.some(action => lowerMessage.includes(action)) ||
                   rentmaticContext.systemTerms.some(term => lowerMessage.includes(term));
        }

        async function sendMessage() {
            if (isProcessing) return;

            const userInput = document.getElementById('userInput');
            const message = userInput.value.trim();
            
            if (!message) return;

            // Check if query is Rentmatic-related
            if (!isRentmaticRelated(message)) {
                addMessage(message, 'user-message');
                addMessage("I can only help with questions about Rentmatic features and functionality. Please ask about specific Rentmatic features like unit management, tenant tracking, or payment processing.", 'ai-message');
                userInput.value = '';
                return;
            }

            isProcessing = true;
            document.querySelector('.send-button').disabled = true;
            userInput.value = '';

            addMessage(message, 'user-message');
            showTypingIndicator();

            try {
                console.log('Sending request to OpenRouter API...');
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`,
                        'HTTP-Referer': window.location.origin,
                        'X-Title': 'Rentmatic AI Assistant'
                    },
                    body: JSON.stringify({
                        model: "deepseek/deepseek-r1:free",
                        messages: [
                            {
                                role: "system",
                                content: systemContext
                            },
                            {
                                role: "user",
                                content: message
                            }
                        ],
                        temperature: 0.7,
                        max_tokens: 800
                    })
                });

                console.log('API Response status:', response.status);
                
                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('API Error Response:', errorData);
                    throw new Error(`API request failed: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                console.log('API Response data:', data);
                
                if (data.choices && data.choices[0]) {
                    let aiResponse = data.choices[0].message.content;
                    
                    // Clean up any potential tool response tags or XML-like content
                    aiResponse = aiResponse
                        .replace(/<tool_response>.*?<\/tool_response>/g, '')
                        .replace(/<[^>]*>/g, '')
                        .replace(/\s+/g, ' ')
                        .trim();
                    
                    if (aiResponse) {
                        addMessage(aiResponse, 'ai-message');
                    } else {
                        throw new Error('Empty or invalid response');
                    }
                } else {
                    throw new Error('Invalid response structure');
                }
            } catch (error) {
                console.error('Detailed error:', error);
                addMessage("I apologize, but I'm having trouble responding right now. Please try asking your question again.", 'ai-message');
            } finally {
                hideTypingIndicator();
                isProcessing = false;
                document.querySelector('.send-button').disabled = false;
            }
        }

        // Add event listener for Enter key
        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
