<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rentmatic Dashboard</title>
    <style>
        :root {
            --primary-color: #2A9D8F;
            --background-color: #f5f5f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-image: url('Dash-Background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .header {
            background-color: #478778;
            height: 60px;
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 20px;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .logo {
            height: 55px;
            width: auto;
        }

        .dashboard-label {
            color: white;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: capitalize;
            margin-left: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .sidebar {
            width: 200px;
            height: 100vh;
            background-color: rgba(240, 255, 235, 0.9);
            position: fixed;
            left: 0;
            top: 60px;
            padding: 20px;
            border-right: 1px solid #eee;
        }

        .nav-item {
            width: 160px;
            padding: 10px;
            margin: 5px 0;
            display: flex;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            transition: background-color 0.2s;
            gap: 10px;
            border-radius: 5px;
        }

        .nav-item:hover, .nav-item.active {
            background-color: #90EE90;
            color: black;
        }

        .nav-item:hover .nav-icon, .nav-item.active .nav-icon {
            filter: brightness(0);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            filter: brightness(0);
        }

        .main-content {
            margin-left: 200px;
            margin-top: 60px;
            padding: 20px;
            height: calc(100vh - 60px);
            display: flex;
            flex-direction: column;
        }

        /* Chat specific styles */
        .chat-container {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            margin: 5px 0;
        }

        .user-message {
            background-color: #90EE90;
            color: black;
            align-self: flex-end;
        }

        .ai-message {
            background-color: #f0f0f0;
            color: black;
            align-self: flex-start;
        }

        .chat-input-container {
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        .chat-input:focus {
            border-color: #478778;
        }

        .send-button {
            padding: 12px 24px;
            background-color: #478778;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .send-button:hover {
            background-color: #2A9D8F;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="Rentmatic-Logo.png" alt="Rentmatic" class="logo">
            <div class="dashboard-label">AI Assistant</div>
        </div>
    </div>

    <div class="sidebar">
        <a href="dashboard.html" class="nav-item">
            <img src="dashboard-icon.png" alt="" class="nav-icon">
            <span>Home</span>
        </a>
        <a href="ai-assistant.html" class="nav-item active">
            <img src="ai-icon.png" alt="" class="nav-icon">
            <span>AI Assistant</span>
        </a>
        <a href="tenants.html" class="nav-item">
            <img src="tenants-icon.png" alt="" class="nav-icon">
            <span>Tenants</span>
        </a>
        <a href="units.html" class="nav-item">
            <img src="units-icon.png" alt="" class="nav-icon">
            <span>Unit Management</span>
        </a>
        <a href="messages.html" class="nav-item">
            <img src="messages-icon.png" alt="" class="nav-icon">
            <span>Messages</span>
        </a>
        <a href="settings.html" class="nav-item">
            <img src="settings-icon.png" alt="" class="nav-icon">
            <span>Settings</span>
        </a>
    </div>

    <div class="main-content">
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message ai-message">
                    Hello! How can I assist you today?
                </div>
            </div>
            <div class="chat-input-container">
                <input type="text" class="chat-input" id="userInput" placeholder="Type your message..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button class="send-button" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        // Placeholder for AI integration
        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (message) {
                // Add user message
                addMessage(message, 'user-message');
                
                // Clear input
                input.value = '';
                
                // Placeholder for AI response
                // This will be replaced with actual API call later
                setTimeout(() => {
                    addMessage('This is a placeholder response. The AI integration will be added soon.', 'ai-message');
                }, 500);
            }
        }

        function addMessage(text, className) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
